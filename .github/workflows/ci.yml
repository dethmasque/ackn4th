# Tests on each OS ackn4th supports, including its sandbox: Seatbelt on
# macOS. (GitHub's Ubuntu runners restrict user namespaces, so the
# bubblewrap tests skip there; `just test-linux` runs them in a
# container.) Windows release builds have no sandbox; the AppContainer one
# is built with -tags winsandbox and tested on its own until it confines.
name: ci
on:
  push:
    branches: ["**"] # tags are tested by release.yml, which calls this
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025] # pinned images; bump deliberately
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal roles sandbox/fixtures | tee /dev/stderr)"
      - run: go vet ./...
      - name: staticcheck and govulncheck
        if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test ./...
      - name: AppContainer sandbox (not in release builds yet)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: go test -tags winsandbox ./internal/sandbox/... ./internal/tools/... ./internal/provider/cliagent/...
